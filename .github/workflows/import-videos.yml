name: Prepare native portfolio videos
on:
  workflow_dispatch:
concurrency:
  group: portfolio-native-video-import
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: |
          python -m pip install gdown==5.2.0
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Download and encode the supplied videos
        shell: python
        run: |
          from pathlib import Path
          import json, re, subprocess
          sources = [
            ('music-video', '14hbz2nGFzNo22Y99DSe1ESwtga3M_dz8', 'I’m So Fucking Cool — music video by Nalini Kantheti; sound design by Kabir'),
            ('freestyle-01', '1bxCPIdUDrUJqZ4vJGbulC1TMSOypy9NA', 'Nalini Kantheti — freestyle session 1'),
            ('freestyle-02', '1ZQ9szRsFC4g_deLlv8d28b11jF3XlNbp', 'Nalini Kantheti — freestyle session 2'),
          ]
          media = Path('assets/media')
          media.mkdir(exist_ok=True)
          page = Path('index.html')
          markup = page.read_text()
          metadata = []
          for slug, drive_id, title in sources:
              original = Path(f'/tmp/{slug}-source')
              subprocess.run(['gdown', f'https://drive.google.com/uc?id={drive_id}', '-O', str(original)], check=True)
              subprocess.run(['ffprobe', '-v', 'error', str(original)], check=True)
              output = media / f'{slug}.mp4'
              subprocess.run(['ffmpeg', '-y', '-i', str(original), '-map', '0:v:0', '-map', '0:a:0?', '-vf', "scale=w='min(720,iw)':h=-2,fps=30", '-c:v', 'libx264', '-preset', 'veryfast', '-crf', '28', '-pix_fmt', 'yuv420p', '-c:a', 'aac', '-b:a', '128k', '-movflags', '+faststart', str(output)], check=True)
              if output.stat().st_size > 90 * 1024 * 1024:
                  raise ValueError(f'{slug} exceeds the repository media budget; needs dedicated hosting')
              poster = media / f'{slug}.jpg'
              subprocess.run(['ffmpeg', '-y', '-i', str(output), '-frames:v', '1', '-q:v', '3', str(poster)], check=True)
              probe = subprocess.check_output(['ffprobe', '-v', 'error', '-select_streams', 'v:0', '-show_entries', 'stream=width,height', '-of', 'json', str(output)])
              dimensions = json.loads(probe)['streams'][0]
              width, height = dimensions['width'], dimensions['height']
              video = f'<video controls playsinline preload="none" poster="{poster.as_posix()}" width="{width}" height="{height}" style="--video-ratio:{width}/{height}" aria-label="{title}"><source src="{output.as_posix()}" type="video/mp4">Your browser does not support video playback.</video>'
              pattern = r'<iframe\b[^>]*src="https://drive\.google\.com/file/d/' + re.escape(drive_id) + r'/preview"[^>]*></iframe>'
              markup, count = re.subn(pattern, lambda _: video, markup)
              if count != 1 and f'src="{output.as_posix()}"' not in markup:
                  raise ValueError(f'Expected one embed for {slug}, found {count}')
              metadata.append({'file': output.as_posix(), 'width': width, 'height': height, 'bytes': output.stat().st_size})
          # Only switch the live markup after all three videos validate.
          page.write_text(markup)
          (media / 'metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
      - name: Save native video assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Host mobile-ready native videos with inline playback controls"
          git pull --rebase origin main
          git push
