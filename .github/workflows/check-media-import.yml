name: Check media import
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-media-import.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const repository = {owner:context.repo.owner,repo:context.repo.repo};
            const runs = await github.rest.actions.listWorkflowRuns({...repository,workflow_id:'import-videos.yml',per_page:1});
            const run = runs.data.workflow_runs[0];
            const jobs = run ? await github.rest.actions.listJobsForWorkflowRun({...repository,run_id:run.id}) : {data:{jobs:[]}};
            const status = {status:run?.status,conclusion:run?.conclusion,jobs:[]};
            for(const job of jobs.data.jobs){
              const item = {name:job.name,status:job.status,conclusion:job.conclusion,steps:job.steps};
              if(job.conclusion==='failure'){
                try {const logs=await github.rest.actions.downloadJobLogsForWorkflowRun({...repository,job_id:job.id});item.logTail=String(logs.data).slice(-7000);} catch(error){item.logError=error.message;}
              }
              status.jobs.push(item);
            }
            fs.writeFileSync('.github/media-import-status.json',JSON.stringify(status,null,2)+'\n');
      - name: Save diagnostic status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/media-import-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record native media import diagnostic status"
          git pull --rebase origin main
          git push
