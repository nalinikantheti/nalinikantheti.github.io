name: Import supplied short stories
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-stories.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the two supplied documents
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import Request, urlopen
          import html, json, re
          documents = [
            ('story-one', '1XDu1rfdwYxrpJ-bGIykwU3e-3McFpWLvVUtN7NffGoo'),
            ('story-two', '1-QC8HzquJ9y_3WFCj3yabEKJUFTLkewWpl531NwGRl8'),
          ]
          stories = []
          for index, (story_id, doc_id) in enumerate(documents, 1):
              def read(url):
                  with urlopen(Request(url, headers={'User-Agent': 'Mozilla/5.0'}), timeout=45) as response:
                      return response.read(2 * 1024 * 1024).decode('utf-8-sig')
              text = read(f'https://docs.google.com/document/d/{doc_id}/export?format=txt')
              if len(text.strip()) < 80 or text.lstrip().lower().startswith(('<!doctype', '<html')):
                  raise ValueError('Document export did not return story text. Check public Viewer sharing.')
              title = ''
              try:
                  page = read(f'https://docs.google.com/document/d/{doc_id}/edit')
                  match = re.search(r'<title>(.*?)</title>', page, re.S)
                  if match:
                      title = html.unescape(re.sub(r'\s*[-–]\s*Google Docs\s*$', '', match[1])).strip()
                      if title in ('Google Docs', 'Sign in - Google Accounts'):
                          title = ''
              except Exception:
                  pass
              if not title:
                  first_line = text.strip().splitlines()[0].strip()
                  title = first_line if len(first_line) <= 90 else f'Short Story {index}'
              stories.append({'id': story_id, 'title': title, 'text': text.strip()})
              print(f'Imported story {index}: {title} ({len(text)} characters)')
          Path('stories-data.js').write_text('const stories = ' + json.dumps(stories, ensure_ascii=False) + ';\n')
      - name: Save the story content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories-data.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import the two artist-supplied short stories"
          git push
