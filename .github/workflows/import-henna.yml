name: Import henna gallery photographs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: python -m pip install gdown==5.2.0 Pillow==12.0.0 pillow-heif==1.1.1
      - name: Import supplied photographs
        shell: python
        run: |
          from pathlib import Path
          import json, subprocess
          from PIL import Image, ImageOps
          import pillow_heif
          pillow_heif.register_heif_opener()
          sources=[
            ('henna-01','1JL4YKAYXrrpxsQ-mLgFEpH5XdCuuA8ua'),
            ('henna-02','1TVCLMFPKc9-DBEbQCle_KJo-MtKABh85'),
            ('henna-03','1Limv7W6tHrrUi7-AMXDxOM_ESFIk_SrB'),
            ('henna-04','19a4a6P7JIUVHINcBmqwbuyAgDJ4CwBp8'),
            ('henna-05','1R3Yr8AdyRceG00H22NJsH9yVDmpcQznA'),
            ('henna-06','1DIa0eVPzuty_KKcJFcf1Zu9GoNcfyu0t'),
            ('henna-07','1dMII7geKFnXBhkSUSdJjKucGuMFKCzSE'),
            ('henna-08','1e8Gj0K1PbBFIvbp7k50t72UXDiFwQ8vr'),
            ('henna-09','1yFVzSH6IDzSQAqZlqHjy-5RkZKAsQoHO'),
            ('henna-10','1ugKGZsQMwHlA-Wx-Iu5i0sS8Zaf7Wcfk'),
            ('henna-11','13nn0Fs9kmrvKUe4BnhKIRu7kpNpf2lho'),
            ('henna-12','16c_cb6vZ7fHP4lGVicy6W64Z3d8VrBl4'),
          ]
          target=Path('assets/henna');target.mkdir(exist_ok=True)
          status=[]
          for name,source_id in sources:
            try:
              raw=Path('/tmp')/name
              subprocess.run(['gdown',f'https://drive.google.com/uc?id={source_id}','-O',str(raw)],check=True)
              with Image.open(raw) as image:
                image=ImageOps.exif_transpose(image).convert('RGB')
                original=image.size
                image.thumbnail((2400,2400),Image.Resampling.LANCZOS)
                image.save(target/f'{name}.webp',quality=92,method=6)
                status.append({'name':name,'status':'ready','original_size':original,'size':image.size})
            except Exception as error:
              status.append({'name':name,'status':'failed','error':str(error)})
          Path('.github/henna-import-status.json').write_text(json.dumps(status,indent=2)+'\n')
      - name: Save imported photographs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/henna .github/henna-import-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import supplied henna artwork and event photographs"
          git pull --rebase origin main
          git push origin HEAD:main
